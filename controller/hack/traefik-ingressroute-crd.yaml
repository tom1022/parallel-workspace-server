# Test-only fixture. This cluster's Traefik is k3s' bundled instance, so
# unlike CNPG (apps/cnpg-operator/cnpg-operator.yaml) there is no GitOps-
# managed manifest in this repo to point envtest at; this trims the fields
# ingress_reconciler.go actually sets from Traefik's published IngressRoute
# CRD so envtest can validate against real schema instead of skipping
# validation entirely.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ingressroutes.traefik.io
spec:
  group: traefik.io
  scope: Namespaced
  names:
    kind: IngressRoute
    listKind: IngressRouteList
    plural: ingressroutes
    singular: ingressroute
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["routes"]
              properties:
                entryPoints:
                  type: array
                  items:
                    type: string
                routes:
                  type: array
                  items:
                    type: object
                    required: ["kind", "match"]
                    properties:
                      kind:
                        type: string
                      match:
                        type: string
                      priority:
                        type: integer
                      middlewares:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                            port:
                              x-kubernetes-int-or-string: true
                            kind:
                              type: string
                tls:
                  type: object
                  properties:
                    secretName:
                      type: string
