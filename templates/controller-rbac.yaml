---
# ワークスペース操作用 ServiceAccount。Workspace Controller Pod (devplatform namespace) が
# mount するため Release.Namespace 側に置き、実際の権限は workspaceNamespace 側の
# Role/RoleBinding (下記) で束縛する。Hermes Agent は Secret 全般や実体の書き換えまで持つ
# この権限を共用せず、apps/hermes-agent が自前の SA を別に持つ。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplatform-workspace-operator
  namespace: {{ .Release.Namespace }}
---
# クラスタ全体の管理権限 (ClusterRole/ClusterRoleBinding) は使わず、workspaceNamespace に
# 束縛した namespace-scoped Role のみを与える (14.1/14.2)。namespaces一覧・
# clusterrolebindings等のクラスタスコープ動詞は含めない。
#
# ここに含めるのは workspaceNamespace 内で完結するリソースのみ。ブランチ専用 DB の
# Database/DatabaseRole (postgresql.cnpg.io) は database.namespace に存在するため
# 本 Role の対象外とし、下に別の namespace-scoped Role/RoleBinding を持つ。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devplatform-workspace-operator
  namespace: {{ .Values.workspaceNamespace }}
rules:
  - apiGroups: ["workspace.tom1022.github.io"]
    resources: ["workspaces", "workspaces/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["workspace.tom1022.github.io"]
    resources: ["workspacetemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["workspace.tom1022.github.io"]
    resources: ["taskrequests", "taskrequests/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devplatform-workspace-operator
  namespace: {{ .Values.workspaceNamespace }}
subjects:
  - kind: ServiceAccount
    name: devplatform-workspace-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: devplatform-workspace-operator
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.workspaceTemplate.database.enabled }}
---
# CNPG の Database/DatabaseRole は database.namespace (workspaceNamespace とは別) に
# 存在するため、上の namespace-scoped Role では届かない。ブランチ専用DBの用意/解放
# (Database Adapter, 3.5) のためだけに、同じ SA をこの namespace にも束縛する。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devplatform-workspace-operator-database
  namespace: {{ .Values.database.namespace }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databases", "databaseroles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devplatform-workspace-operator-database
  namespace: {{ .Values.database.namespace }}
subjects:
  - kind: ServiceAccount
    name: devplatform-workspace-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: devplatform-workspace-operator-database
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.controller.clusterNodeAccess.enabled }}
---
# Node はクラスタスコープのため namespace 束縛の Role では権限を与えられない。15.4 の
# 事前配置判定 (Node.status.images 参照) にのみ必要な read-only 権限を、他の全 namespace-scoped
# 権限とは別に最小限で付与する (get/list/watch のみ、書き込みなし)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devplatform-workspace-operator-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devplatform-workspace-operator-nodes
subjects:
  - kind: ServiceAccount
    name: devplatform-workspace-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: devplatform-workspace-operator-nodes
  apiGroup: rbac.authorization.k8s.io
{{- end }}
