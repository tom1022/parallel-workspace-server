{{- if .Values.evacuationCredentials.autoProvision.enabled }}
{{- $gc := .Values.evacuationCredentials.autoProvision.garage }}
---
# 退避先 S3 の資格情報をクラスタ内で発行する (16.7-16.9)。同一クラスタの Garage には
# 外部の発行元が存在せず、配備時に鍵を作れば足りる。冪等性は 2 段で担保する:
# 目的の Secret があれば即終了し、無い場合も Garage 側に同名の鍵があればそれを
# 読み直して同じ値で Secret を作り直す。既存の退避データへの到達性は失われない。
#
# 生成物を Helm テンプレートとして持たない理由: Argo CD は helm template で
# マニフェストを生成するため lookup がクラスタを見ず、「あれば維持」を表現できない。
# 同期のたびに鍵が置き換わり、退避データへ到達できなくなる。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplatform-evacuation-credentials
  namespace: {{ .Release.Namespace }}
---
# 退避先 Garage への到達。garage の setup-job と同じく CLI を Pod 内で実行する。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devplatform-evacuation-credentials
  namespace: {{ $gc.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devplatform-evacuation-credentials
  namespace: {{ $gc.namespace }}
subjects:
  - kind: ServiceAccount
    name: devplatform-evacuation-credentials
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: devplatform-evacuation-credentials
  apiGroup: rbac.authorization.k8s.io
---
# 発行した資格情報の置き場。読み出しと書き換えは退避用 Secret 1 つに閉じ、
# 同ネームスペースの Claude Code 資格情報には到達させない (14.8)。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devplatform-evacuation-credentials
  namespace: {{ .Values.workspaceNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.workspaceTemplate.evacuation.secretRef }}"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devplatform-evacuation-credentials
  namespace: {{ .Values.workspaceNamespace }}
subjects:
  - kind: ServiceAccount
    name: devplatform-evacuation-credentials
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: devplatform-evacuation-credentials
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devplatform-evacuation-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    # ワークスペース専用ネームスペースが同じ同期で作られるため PostSync に置く。
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # ttlSecondsAfterFinished を付けない。失敗した hook の Pod ごと消えて原因が追えなくなる。
  # 後始末は hook-delete-policy が次回の hook 作成前に行う。
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: devplatform-evacuation-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: {{ .Values.evacuationCredentials.autoProvision.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.evacuationCredentials.autoProvision.resources | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              NS={{ .Values.workspaceNamespace }}
              SECRET={{ .Values.workspaceTemplate.evacuation.secretRef }}
              if kubectl -n "$NS" get secret "$SECRET" >/dev/null 2>&1; then
                echo "$NS/$SECRET already exists; leaving the existing credentials in place"
                exit 0
              fi

              POD=$(kubectl -n {{ $gc.namespace }} get pod -l {{ $gc.podSelector }} -o name | head -n 1)
              if [ -z "$POD" ]; then
                echo "no Garage pod matching {{ $gc.podSelector }} in {{ $gc.namespace }}" >&2
                exit 1
              fi
              garage() {
                kubectl -n {{ $gc.namespace }} exec "$POD" -- /garage -c {{ $gc.configPath }} "$@"
              }

              if ! INFO=$(garage key info --show-secret {{ $gc.keyName }} 2>/dev/null); then
                garage key create {{ $gc.keyName }} >/dev/null
                INFO=$(garage key info --show-secret {{ $gc.keyName }})
              fi
              ACCESS_KEY=$(printf '%s\n' "$INFO" | sed -n 's/^Key ID: *//p' | head -n 1)
              SECRET_KEY=$(printf '%s\n' "$INFO" | sed -n 's/^Secret key: *//p' | head -n 1)
              if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
                echo "could not read key material for {{ $gc.keyName }} from Garage" >&2
                exit 1
              fi

              # 退避先バケットは apps/garage の values.yaml にも宣言されているが、それを作る
              # setup-job は Argo CD の PostSync hook で、hook リソースは差分計算の対象外に
              # なる。バケットを増やしても garage の Application は Synced のままで hook が
              # 再実行されず、宣言だけあってバケットが存在しない状態になりうる。
              if ! garage bucket info {{ .Values.workspaceTemplate.evacuation.bucket }} >/dev/null 2>&1; then
                garage bucket create {{ .Values.workspaceTemplate.evacuation.bucket }} >/dev/null
              fi
              garage bucket allow --read --write {{ .Values.workspaceTemplate.evacuation.bucket }} --key {{ $gc.keyName }}

              kubectl -n "$NS" create secret generic "$SECRET" \
                --from-literal=access-key="$ACCESS_KEY" \
                --from-literal=secret-key="$SECRET_KEY"
              # Argo CD の一律 prune/selfHeal から守る。この Secret はチャートが
              # レンダリングしないため通常は追跡対象外だが、注釈で二重に閉じる。
              kubectl -n "$NS" annotate secret "$SECRET" \
                argocd.argoproj.io/sync-options='Prune=false,Delete=false'
              echo "provisioned $NS/$SECRET"
{{- end }}
