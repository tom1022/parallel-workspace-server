apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspacetemplates.devplatform.fickledev.com
  annotations:
    # 全 Application が一律 prune/selfHeal のため、この注釈が CRD を誤削除から守る
    # 唯一の防御 (要件 17.5)。CRD が消えると既存 WorkspaceTemplate/Workspace が
    # 実体ごと読めなくなり、稼働中ワークスペースの調停が止まる。
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: devplatform.fickledev.com
  scope: Namespaced
  names:
    kind: WorkspaceTemplate
    listKind: WorkspaceTemplateList
    plural: workspacetemplates
    singular: workspacetemplate
    shortNames:
      - wst
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              description: 運用者が配備時に設定する、ワークスペース払い出しの雛形 (design.md #Logical Data Model)。
              required:
                - image
                - resources
                - database
                - auth
                - evacuation
              properties:
                image:
                  type: string
                  description: ベースイメージ。不変なバージョン識別子 (digest 等) で指定し、可変タグを参照しない (15.2)。
                  minLength: 1
                resources:
                  type: object
                  required:
                    - requests
                    - limits
                  properties:
                    requests:
                      type: object
                      required:
                        - cpu
                        - memory
                      properties:
                        cpu:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(m)?$'
                        memory:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                    limits:
                      type: object
                      required:
                        - cpu
                        - memory
                      properties:
                        cpu:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(m)?$'
                        memory:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                storage:
                  type: object
                  description: 作業ディレクトリ用 PVC。local-path は拡張不可のため size が事実上の上限(C-7)。
                  default:
                    size: 20Gi
                  properties:
                    size:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                      default: 20Gi
                    nodeDiskBudget:
                      type: string
                      description: |
                        この nodeName へ配置された全ワークスペースの作業ディレクトリ容量 (size) 合計に対する上限
                        (15.11)。実測ディスク使用量ではなく宣言値の合計による近似。空文字は上限なしを意味する。
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                      default: 100Gi
                nodeName:
                  type: string
                  description: |
                    配置先ノード。local-path PVC はノード固定のためスケジューラ任せにせず明示指定する
                    (§ワークスペースの配置ノード)。払い出し後は変更できない。
                  default: k3s-agent-z440
                priorityClassName:
                  type: string
                  description: 既存アプリより低い優先度クラス。ノード逼迫時にワークスペース側を先に退避対象とする (15.10)。
                  default: devplatform-workspace
                model:
                  type: string
                  description: |
                    このテンプレートから払い出すワークスペースの既定モデル (7.3)。空の場合は
                    Claude Code 自身の既定モデルをそのまま用いる。
                database:
                  type: object
                  required:
                    - clusterRef
                  properties:
                    clusterRef:
                      type: string
                      description: ブランチ専用 CNPG インスタンス (Cluster リソース名) への参照 (8.1)。
                      minLength: 1
                auth:
                  type: object
                  required:
                    - secretRef
                  properties:
                    secretRef:
                      type: string
                      description: Claude Code の長期認証情報を保持する Secret 名 (5.1)。
                      minLength: 1
                evacuation:
                  type: object
                  required:
                    - bucket
                    - secretRef
                  properties:
                    bucket:
                      type: string
                      description: 作業内容の退避先 Garage バケット名 (16.7-16.9)。
                      minLength: 1
                    secretRef:
                      type: string
                      description: |
                        退避先 Garage の S3 資格情報を保持する Secret 名。ワークスペース Pod が
                        access-key / secret-key の 2 キーを環境変数として読む。
                      minLength: 1
