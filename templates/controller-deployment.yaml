# Workspace Controller (design.md の 3 調停ループのうち、Workspace 調停ループと
# タスクディスパッチループ)。Blackboard ループは後続タスクで同じ Deployment 内の
# Manager へ追加する。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devplatform-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: devplatform-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devplatform-controller
  template:
    metadata:
      labels:
        app: devplatform-controller
    spec:
      # controller-rbac.yaml binds this SA's Role to workspaceNamespace only
      # (14.1/14.2); WORKSPACE_NAMESPACE above additionally scopes the cache.
      serviceAccountName: devplatform-workspace-operator
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}{{ if .Values.controller.image.digest }}@{{ .Values.controller.image.digest }}{{ end }}"
          command:
            {{- toYaml .Values.controller.command | nindent 12 }}
          env:
            # Bounds the Manager's cache/client to this one namespace so the
            # controller has no way to observe or touch resources outside it
            # (14.1/14.2), independent of what its RBAC Role additionally allows.
            - name: WORKSPACE_NAMESPACE
              value: {{ .Values.workspaceNamespace | quote }}
            # 同時に実行中の Claude Code タスク数の上限 (7.1)。超過分は TaskRequest として
            # キューに残る。
            - name: MAX_CONCURRENT_TASKS
              value: {{ required "taskQueue.maxConcurrent must be set" .Values.taskQueue.maxConcurrent | quote }}
            # モデル別の利用枠に到達したときの切り替え順 (7.7)。
            - name: MODEL_FALLBACKS
              value: {{ join "," .Values.taskQueue.modelFallbacks | quote }}
            # ワークスペースのプレビュー/レポートの入口をどの実装 (RoutingAdapter) で
            # 生成するか (3.1/3.2)。公開ホスト・証明書は routing 専用の値を持たず
            # gateway.domain / gateway.tls.secretName を使う (セッションと同一ドメイン・
            # 同一証明書のため)。
            - name: ROUTING_TYPE
              value: {{ .Values.routing.type | default "ingress" | quote }}
            - name: ROUTING_DOMAIN
              value: {{ required "gateway.domain must be set" .Values.gateway.domain | quote }}
            - name: ROUTING_TLS_SECRET_NAME
              value: {{ required "gateway.tls.secretName must be set" .Values.gateway.tls.secretName | quote }}
            - name: ROUTING_INGRESS_CLASS_NAME
              value: {{ .Values.routing.ingressClassName | default "" | quote }}
            - name: ROUTING_EXPOSURE_MIDDLEWARE_REFS
              value: {{ join "," (.Values.routing.exposure.middlewareRefs | default (list)) | quote }}
            - name: ROUTING_EXPOSURE_ANNOTATIONS
              value: {{ .Values.routing.exposure.annotations | default dict | toJson | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if .Values.controller.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/devplatform
          {{- end }}
      {{- if .Values.controller.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.controller.persistence.name }}
      {{- end }}
