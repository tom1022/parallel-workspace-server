# 秘匿情報は Infisical Operator が実行時に同期する (14.4/14.5)。値そのものは
# コミットせず、Infisical 側の secretPath とキー名への参照のみをここに置く。
#
# ここに残すのは、外部のアカウントや契約がないと発行できず自動化しようがないものだけ。
# SSH 認証局の鍵ペアと退避先 S3 の資格情報はクラスタ内で発行され、データベースの
# 資格情報は CNPG が生成する。それらの同期定義は下部の任意ブロックにあり、既定では
# 出力されない。
---
# Claude Code の長期認証情報 (5.1)。workspacetemplate.yaml の spec.auth.secretRef および
# crd-workspacetemplate.yaml の auth.secretRef が参照する Secret 名と一致させる。
# ワークスペース Pod がマウントできるよう、ワークスペース専用ネームスペースへ同期する。
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.workspaceTemplate.auth.secretRef }}
  namespace: {{ .Values.workspaceNamespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.workspaceTemplate.auth.secretRef }}
      namespace: {{ .Values.workspaceNamespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          credentials.json: '{{ "{{" }} .DEVPLATFORM_WORKSPACE_CLAUDE_CODE_CREDENTIALS.Value {{ "}}" }}'
---
# 推論バックエンドの資格情報。Claude Code のサブスクリプション認証とは別系統の API キー
# (Technology Stack: 推論バックエンドは Claude Code と別系統, 6.12/18.5) の参照定義を
# 先行して用意する。実際に消費するコンポーネントは後続タスク (9.2) で実装する。
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.infisical.inferenceCredentialsSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.infisical.inferenceCredentialsSecretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          api-key: '{{ "{{" }} .DEVPLATFORM_INFERENCE_API_KEY.Value {{ "}}" }}'
{{- if .Values.infisical.sshCa.enabled }}
---
# 自前の SSH 認証局を持ち込む場合の経路 (既定は無効)。共有端末ゲートウェイの
# ネームスペースにのみ同期し、ワークスペース専用ネームスペースへは複製しない。
# 漏洩時の影響範囲が全ワークスペースに及ぶため、参照できるワークロードをゲートウェイ
# 1 つに閉じる。公開鍵はゲートウェイが秘密鍵から導出して書き出すため、ここでは扱わない。
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.gateway.ssh.caSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.gateway.ssh.caSecretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          {{ .Values.gateway.ssh.caKeySecretKey }}: '{{ "{{" }} .DEVPLATFORM_SSH_CA_PRIVATE_KEY.Value {{ "}}" }}'
{{- end }}
{{- if .Values.infisical.evacuation.enabled }}
---
# 外部 S3 を退避先にする場合の経路 (既定は無効)。退避を実行するのはワークスペース Pod
# 自身であり制御プレーンではないため、ワークスペース専用ネームスペースにのみ同期する。
# キー名は resources.go の evacuationAccessKeyKey / evacuationSecretKeyKey と一致させる。
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.workspaceTemplate.evacuation.secretRef }}
  namespace: {{ .Values.workspaceNamespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.workspaceTemplate.evacuation.secretRef }}
      namespace: {{ .Values.workspaceNamespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          access-key: '{{ "{{" }} .DEVPLATFORM_EVACUATION_ACCESS_KEY_ID.Value {{ "}}" }}'
          secret-key: '{{ "{{" }} .DEVPLATFORM_EVACUATION_SECRET_ACCESS_KEY.Value {{ "}}" }}'
{{- end }}
