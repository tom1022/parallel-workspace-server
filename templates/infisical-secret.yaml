# 秘匿情報は Infisical Operator が実行時に同期する (14.4/14.5)。値そのものは
# コミットせず、Infisical 側の secretPath とキー名への参照のみをここに置く。
---
# Claude Code の長期認証情報 (5.1)。workspacetemplate.yaml の spec.auth.secretRef および
# crd-workspacetemplate.yaml の auth.secretRef が参照する Secret 名と一致させる。
# ワークスペース Pod がマウントできるよう、ワークスペース専用ネームスペースへ同期する。
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.workspaceTemplate.auth.secretRef }}
  namespace: {{ .Values.workspaceNamespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.workspaceTemplate.auth.secretRef }}
      namespace: {{ .Values.workspaceNamespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          credentials.json: '{{ "{{" }} .DEVPLATFORM_WORKSPACE_CLAUDE_CODE_CREDENTIALS.Value {{ "}}" }}'
---
# 推論バックエンドの資格情報。Claude Code のサブスクリプション認証とは別系統の API キー
# (Technology Stack: 推論バックエンドは Claude Code と別系統, 6.12/18.5) の参照定義を
# 先行して用意する。実際に消費するコンポーネントは後続タスク (9.2) で実装する。
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.infisical.inferenceCredentialsSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.infisical.inferenceCredentialsSecretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          api-key: '{{ "{{" }} .DEVPLATFORM_INFERENCE_API_KEY.Value {{ "}}" }}'
---
# データベース資格情報。apps/devplatform-db/infisical-devplatform-db-secret.yaml が
# 同じ Infisical キーを devplatform-db ネームスペースへ同期しているが、Kubernetes Secret は
# ネームスペースを越えて参照できないため、Workspace Controller と同じ devplatform
# ネームスペースにも同一キーを複製する (Controller 自体は database.clusterRef 経由で
# CNPG の Database/DatabaseRole を作成するのみで、これらの資格情報は直接消費しない。
# 疎通確認等の後続用途に備えた参照定義)。
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.infisical.dbCredentialsSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.infisical.dbCredentialsSecretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: kubernetes.io/basic-auth
      template:
        engineVersion: v1
        data:
          username: '{{ "{{" }} .DEVPLATFORM_DB_SUPERUSER_USERNAME.Value {{ "}}" }}'
          password: '{{ "{{" }} .DEVPLATFORM_DB_SUPERUSER_PASSWORD.Value {{ "}}" }}'
