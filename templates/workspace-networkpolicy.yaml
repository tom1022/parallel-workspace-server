---
# ワークスペース隔離の NetworkPolicy。podSelector: {} でネームスペース内の全 Pod に適用し、
# policyTypes に Ingress/Egress 両方を指定することで既定 deny へ切り替える (14.7/14.8)。
#
# 全ワークスペースが単一の workspaceNamespace を共有し、ワークスペース 1 つは Pod 1 つで
# 構成されるため、同一 namespace 内の Pod を指す peer は「他のワークスペース」以外を意味
# しない。したがって ingress/egress のいずれにも同一 namespace の peer を置かない (14.7)。
#
# ingress: 制御プレーン namespace から Session Supervisor のポートへの到達と、subnet router
# namespace からワークスペース sshd への到達のみを許可する。ワークスペース外から入る経路は
# この 2 つだけで、Workspace Controller の POST /evacuate
# (16.8) と、共有端末ゲートウェイが開発者のブラウザ接続を中継するための出力取得・入力送出、
# そして統合開発環境からの任意経路 (4.7) が該当する。前 2 つはいずれも Release.Namespace
# (devplatform) に居るため同一の from で足りる。それ以外の namespace からの到達は拒否する。
# subnet router は経路を SNAT して転送するため、送信元は Connector が生成する Pod となり
# namespaceSelector で絞れる。
# 加えて Traefik からプレビュー (3000/tcp) とレポート (8080/tcp) への到達を許可する。
# Workspace Controller が払い出す IngressRoute (11.1) の転送先がこの 2 ポートで、
# k3s 同梱の Traefik は kube-system に常駐するため、この経路がないと生成した
# ルーティングが機能しない。kube-system には CoreDNS 等の無関係な Pod も居るので
# podSelector で Traefik に限定する (Pod IP は再作成のたびに変わるため ipBlock では絞れない)。
#
# egress: devplatform-db namespace (ブランチ専用 DB、5432/tcp)、
# garage namespace (退避・レポート保管先のオブジェクトストレージ、3900/tcp)、kube-system
# namespace (CoreDNS と Traefik forward auth 解決) への到達を許可する。加えて外部
# (クラスタ内 Pod/Service CIDR を除いた 0.0.0.0/0) への 443/53 番ポートのみを許可し、
# Git リモートと Anthropic API への到達を確保する。
#
# ponytail: kube-router (k3s既定CNI) はL3/L4のNetworkPolicyのみでFQDN単位のegressフィルタに
# 対応しないため、Git リモート・Anthropic API を宛先IPで絞れず443番ポート全体を外部へ開ける
# 現実解にとどめている。FQDN制限が必要になったら、CiliumNetworkPolicyのfqdn selectorへの
# 移行、またはegressプロキシの経由が upgrade path。
#
# 他 namespace の Secret への到達遮断はネットワーク到達性の話ではなく kube-apiserver 経由の
# API アクセス制御の話のため、NetworkPolicy の対象外とする。Secret 保護は
# controller-rbac.yaml の Role スコープ (workspaceNamespace 限定) 側で担保する (14.8)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devplatform-workspace-isolation
  namespace: {{ .Values.workspaceNamespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 8787
    {{- with .Values.subnetRouterNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: 22
    {{- end }}
    {{- with .Values.routing.ingressNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          {{- with $.Values.routing.ingressPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    {{- with .Values.database.namespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- with .Values.objectStorage.namespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: 3900
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.network.excludeCIDRs }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
