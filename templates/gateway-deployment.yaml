---
# 共有端末ゲートウェイ (design.md "Terminal Gateway")。必須の到達経路における常駐物は
# クラスタ全体でこの 1 つだけであり、ワークスペースごとの編集用サーバは置かない (4.3)。
# ステートレスなため replicas は運用判断で増やせる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devplatform-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: devplatform-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: devplatform-gateway
  template:
    metadata:
      labels:
        app: devplatform-gateway
    spec:
      serviceAccountName: devplatform-gateway
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}{{ if .Values.gateway.image.digest }}@{{ .Values.gateway.image.digest }}{{ end }}"
          env:
            - name: GATEWAY_ADDR
              value: ":{{ .Values.gateway.port }}"
            - name: WORKSPACE_NAMESPACE
              value: {{ .Values.workspaceNamespace }}
            - name: WORKSPACE_TEMPLATE_REF
              value: {{ .Values.workspaceTemplate.name }}
            # aud は認可サーバ側のクライアント識別子と一致させる (4.12)。ずれると
            # 正当なトークンが一律 401 になる。
            - name: OIDC_ISSUER
              value: {{ .Values.gateway.oidc.issuer | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.gateway.oidc.audience | quote }}
            - name: OIDC_JWKS_URL
              value: {{ .Values.gateway.oidc.jwksUrl | quote }}
            # 起動時に SSH 認証局の鍵ペアを Kubernetes API 上で確定させる。既に
            # Secret があればそれを使い、無ければ生成して作る (発行済み証明書を
            # 失効させないため再生成しない)。運用者が自前の認証局を使う場合は
            # この Secret を先に置く。
            - name: GATEWAY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SSH_CA_SECRET_NAME
              value: {{ .Values.gateway.ssh.caSecretName }}
            - name: SSH_CA_SECRET_KEY
              value: {{ .Values.gateway.ssh.caKeySecretKey }}
            - name: SSH_CA_PUBLIC_SECRET_NAME
              value: {{ .Values.gateway.ssh.caPublicSecretName }}
            - name: SSH_CA_PUBLIC_SECRET_KEY
              value: {{ .Values.gateway.ssh.caPublicSecretKey }}
            - name: SSH_CERTIFICATE_TTL
              value: {{ .Values.gateway.ssh.certificateTtl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: devplatform-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: devplatform-gateway
spec:
  selector:
    app: devplatform-gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
