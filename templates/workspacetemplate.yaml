# 既定の WorkspaceTemplate 実体。GitOps 管理下に置き (17.4)、実行時に払い出される
# Workspace 自体はここに含めない (design.md 231行、17.4)。
apiVersion: workspace.tom1022.github.io/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: {{ .Values.workspaceTemplate.name }}
  namespace: {{ .Values.workspaceNamespace }}
  labels:
    app.kubernetes.io/name: devplatform-workspacetemplate
  annotations:
    # WorkspaceTemplate が誤って prune/削除されると、参照中の Workspace が
    # 払い出しテンプレートを失い再調停できなくなる。CRD 本体と同じ理由で保護する
    # (要件 17.5 の実効的な適用範囲として、テンプレート実体にも付与する)。
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # 事前配置 (image-prestage-daemonset.yaml) と同一の参照。両者が食い違うと、
  # 配置完了を根拠とする払い出し条件 (15.4) が別のイメージについて成立する。
  image: "{{ .Values.workspaceImage.repository }}:{{ .Values.workspaceImage.tag }}{{ if .Values.workspaceImage.digest }}@{{ .Values.workspaceImage.digest }}{{ end }}"
  resources:
    requests:
      cpu: {{ .Values.workspaceTemplate.resources.requests.cpu | quote }}
      memory: {{ .Values.workspaceTemplate.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.workspaceTemplate.resources.limits.cpu | quote }}
      memory: {{ .Values.workspaceTemplate.resources.limits.memory | quote }}
  storage:
    size: {{ .Values.workspaceTemplate.storage.size | quote }}
    nodeDiskBudget: {{ .Values.workspaceTemplate.storage.nodeDiskBudget | quote }}
  {{- with .Values.workspaceTemplate.nodeName }}
  nodeName: {{ . }}
  {{- end }}
  priorityClassName: {{ .Values.workspaceTemplate.priorityClassName }}
{{- with .Values.workspaceTemplate.model }}
  model: {{ . | quote }}
{{- end }}
  database:
    clusterRef: {{ .Values.workspaceTemplate.database.clusterRef }}
  auth:
    secretRef: {{ .Values.workspaceTemplate.auth.secretRef }}
  evacuation:
    bucket: {{ .Values.workspaceTemplate.evacuation.bucket }}
    secretRef: {{ .Values.workspaceTemplate.evacuation.secretRef }}
