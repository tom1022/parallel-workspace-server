---
# 共有端末ゲートウェイ専用の ServiceAccount。Workspace Controller の
# devplatform-workspace-operator とは分ける: ゲートウェイが必要とするのは Workspace の
# 読み書き、ワークスペース Pod のアドレス解決、および自身が所有する SSH 認証局の
# 鍵ペアの確定だけで、StatefulSet を触る権限は持たせない (14.1/14.2)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplatform-gateway
  namespace: {{ .Release.Namespace }}
---
# ホスト名からワークスペースへの解決と /api/ 配下の操作はすべてこの権限だけで完結する。
# 制御プレーンおよび Hermes Agent が停止していても払い出し済みワークスペースへの到達と
# 操作が続くのはこのためである (4.9/19.8)。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devplatform-gateway
  namespace: {{ .Values.workspaceNamespace }}
rules:
  # patch は接続・切断の通知に使う。書き込む先は annotation のみで、status は
  # Workspace Controller が唯一の書き手であるため触らない (4.8)。
  - apiGroups: ["devplatform.fickledev.com"]
    resources: ["workspaces"]
    verbs: ["get", "list", "create", "delete", "patch"]
  # セッションの到達先は Pod の podIP。ワークスペースには Service が存在しないため
  # Pod を直接引く。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # SSH 認証局の公開鍵をワークスペースの sshd 向けに公開する。resourceNames で
  # その 1 つに閉じ、同ネームスペースにある Claude Code の資格情報や退避先の
  # アクセスキーには到達させない (14.8)。create は Kubernetes の認可モデル上
  # resourceNames で絞れないが、値を読み出せる操作ではない。
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.gateway.ssh.caPublicSecretName }}"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devplatform-gateway
  namespace: {{ .Values.workspaceNamespace }}
subjects:
  - kind: ServiceAccount
    name: devplatform-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: devplatform-gateway
  apiGroup: rbac.authorization.k8s.io
---
# SSH 認証局の秘密鍵はこのネームスペースから出さない (14.4/14.5)。ゲートウェイ自身が
# 起動時に鍵を確定させるため、その 1 つの Secret への権限だけを与える。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devplatform-gateway-ssh-ca
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.gateway.ssh.caSecretName }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devplatform-gateway-ssh-ca
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: devplatform-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: devplatform-gateway-ssh-ca
  apiGroup: rbac.authorization.k8s.io
