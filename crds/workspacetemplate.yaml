apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspacetemplates.workspace.tom1022.github.io
  annotations:
    # 全 Application が一律 prune/selfHeal のため、この注釈が CRD を誤削除から守る
    # 唯一の防御 (要件 17.5)。CRD が消えると既存 WorkspaceTemplate/Workspace が
    # 実体ごと読めなくなり、稼働中ワークスペースの調停が止まる。
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  group: workspace.tom1022.github.io
  scope: Namespaced
  names:
    kind: WorkspaceTemplate
    listKind: WorkspaceTemplateList
    plural: workspacetemplates
    singular: workspacetemplate
    shortNames:
      - wst
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              description: 運用者が配備時に設定する、ワークスペース払い出しの雛形 (design.md #Logical Data Model)。
              required:
                - image
                - resources
                - database
                - auth
                - evacuation
              properties:
                image:
                  type: string
                  description: ベースイメージ。不変なバージョン識別子 (digest 等) で指定し、可変タグを参照しない (15.2)。
                  minLength: 1
                resources:
                  type: object
                  required:
                    - requests
                    - limits
                  properties:
                    requests:
                      type: object
                      required:
                        - cpu
                        - memory
                      properties:
                        cpu:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(m)?$'
                        memory:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                    limits:
                      type: object
                      required:
                        - cpu
                        - memory
                      properties:
                        cpu:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(m)?$'
                        memory:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                storage:
                  type: object
                  description: |
                    作業ディレクトリ用 PVC。local-path 等ノード固定の StorageClass では
                    size が事実上の上限(C-7)。接続中のみ存在する VS Code Server
                    (.vscode-server) の分もこの容量に含める(4.10)。
                  properties:
                    size:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                    nodeDiskBudget:
                      type: string
                      description: |
                        この nodeName へ配置された全ワークスペースの作業ディレクトリ容量 (size) 合計に対する上限
                        (15.11)。実測ディスク使用量ではなく宣言値の合計による近似。空文字は上限なしを意味する。
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                nodeName:
                  type: string
                  description: |
                    配置先ノード。省略時は配置制約を課さずスケジューラに任せる。
                    ノード固定の StorageClass (local-path 等) を使う場合は明示指定する
                    (§ワークスペースの配置ノード)。払い出し後は変更できない。
                priorityClassName:
                  type: string
                  description: ワークスペース Pod に適用する PriorityClass 名。ノード逼迫時の退避順位を決める (15.10)。
                model:
                  type: string
                  description: |
                    このテンプレートから払い出すワークスペースの既定モデル (7.3)。空の場合は
                    Claude Code 自身の既定モデルをそのまま用いる。
                database:
                  type: object
                  required:
                    - clusterRef
                  properties:
                    clusterRef:
                      type: string
                      description: ブランチ専用 CNPG インスタンス (Cluster リソース名) への参照 (8.1)。
                      minLength: 1
                auth:
                  type: object
                  required:
                    - secretRef
                  properties:
                    secretRef:
                      type: string
                      description: Claude Code の長期認証情報を保持する Secret 名 (5.1)。
                      minLength: 1
                evacuation:
                  type: object
                  required:
                    - bucket
                    - endpoint
                    - region
                    - secretRef
                  properties:
                    bucket:
                      type: string
                      description: 作業内容の退避先バケット名 (16.7-16.9)。
                      minLength: 1
                    endpoint:
                      type: string
                      description: 退避先の S3 互換エンドポイント (例 http://host:port)。特定の実装に固定しない。
                      minLength: 1
                    region:
                      type: string
                      description: 退避先バケットのリージョン。
                      minLength: 1
                    secretRef:
                      type: string
                      description: |
                        退避先の S3 資格情報を保持する Secret 名。ワークスペース Pod が
                        access-key / secret-key の 2 キーを環境変数として読む。
                      minLength: 1
