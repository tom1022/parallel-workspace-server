name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      # controller のテストは実 API サーバ (envtest) を必要とするが、そのバイナリは
      # ランナーに存在しないため毎回取得し、パスを KUBEBUILDER_ASSETS として後続ステップに渡す。
      - name: Fetch envtest Kubernetes 1.31 binaries
        run: echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.31.x --bin-dir "${RUNNER_TEMP}/envtest" -p path)" >> "$GITHUB_ENV"
      - run: go test ./...

  test-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: go test ./...

  test-supervisor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supervisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: supervisor/go.mod
      - name: DEBUG script/pty attach
        run: |
          which script && script --version || true
          tmux -L dbg new-session -d -s w -c /tmp sh -c 'cat > /tmp/typed.txt'
          script -q -c "tmux -L dbg attach -t w -r" /dev/null &
          SPID=$!
          sleep 2
          echo "script pid alive?"; kill -0 $SPID && echo yes || echo no
          tmux -L dbg list-clients -t w -F '#{client_name}|#{client_readonly}|#{client_created}' || echo "list-clients failed: $?"
          kill $SPID 2>/dev/null || true
          tmux -L dbg kill-server || true
      - run: go test ./...

  chart-lint:
    runs-on: ubuntu-latest
    # Go テストのいずれかが失敗した場合にチャートの問題調査へ進ませないための順序付け。
    needs: [test-controller, test-gateway, test-supervisor]
    steps:
      - uses: actions/checkout@v4
      # values.yaml は利用者が埋める前提の必須値を空文字列のまま置いているため、
      # 素の helm lint は values.schema.json の検証で必ず失敗する。
      - run: helm lint . -f hack/testdata/minimal-values.yaml

  portability-gate:
    runs-on: ubuntu-latest
    needs: [chart-lint]
    steps:
      - uses: actions/checkout@v4
      - run: bash hack/portability-check.test.sh
      - run: bash hack/portability-check.sh
      - run: bash hack/update-image-refs.test.sh
